services:
  - type: web
    name: agency-overlord
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "0"
      - key: ALLOW_LIVE_PUBLISH
        value: "0"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /app/data/agency_overlord.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
    disk:
      name: agency-overlord-data
      mountPath: /app/data
      sizeGB: 1

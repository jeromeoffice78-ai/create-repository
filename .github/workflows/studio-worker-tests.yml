name: Studio media worker checks

on:
  pull_request:
    branches: [studio-media-worker]
  push:
    branches: [studio-media-worker]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Compile service and tests
        run: python -m py_compile studio_media/worker.py studio_media/test_worker.py
      - name: Run actual render and status tests
        run: python -m unittest -v test_worker
        working-directory: studio_media

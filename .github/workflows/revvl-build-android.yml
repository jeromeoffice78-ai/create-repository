name: Build REVVL Tab 2 launcher APK
on:
  push:
    branches: [revvl-tab2-android-launcher]
    paths:
      - "revvl-launcher/**"
      - ".github/workflows/revvl-build-android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android launcher
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install SDK packages using preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Check Recovery dashboard JavaScript syntax and updated engine controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('revvl-launcher/app/src/main/assets/REVVL_Super_Tablet_v2.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html,re.I)
          assert scripts, 'No inline dashboard scripts'
          Path('/tmp/revvl-dashboard-js-check.js').write_text('\n'.join(scripts))
          for required in ['character-engine-test','identifyCharacterEngine','episode_2_saved_scenes','approved_cast_photos_saved']:
              assert required in html, required+' control missing'
          print('Validated Recovery diagnostics UI and inline JavaScript extraction')
          PY
          node --check /tmp/revvl-dashboard-js-check.js
      - name: Build debug APK
        run: gradle --project-dir revvl-launcher --no-daemon :app:assembleDebug
      - name: Allow Android emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 on-device emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r revvl-launcher/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.revvl.supertablet.recovery/com.revvl.supertablet.MainActivity
            adb forward tcp:18788 tcp:8788
            for i in $(seq 1 25); do if curl -fsS -D /tmp/revvl-headers.txt -o /tmp/revvl-home.html http://127.0.0.1:18788/REVVL_Super_Tablet_v2.html; then break; fi; sleep 2; done
            grep -q '200 OK' /tmp/revvl-headers.txt
            grep -q 'X-REVVL-Server: REVVL-RECOVERY/3.6' /tmp/revvl-headers.txt
            grep -q 'REVVL Super Tablet v3.6' /tmp/revvl-home.html
            curl -fsS -D /tmp/revvl-compute-headers.txt -o /tmp/revvl-compute.html http://127.0.0.1:18788/REVVL_Compute_Control.html
            grep -q '200 OK' /tmp/revvl-compute-headers.txt
            grep -q 'Supercomputer Control Center' /tmp/revvl-compute.html
            grep -q 'X-REVVL-Server: REVVL-RECOVERY/3.6' /tmp/revvl-compute-headers.txt
            echo "REVVL v3.6 dashboard and compute console served correctly on Android 15."
      - name: Publish a browser-downloadable Recovery repair APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp revvl-launcher/app/build/outputs/apk/debug/app-debug.apk REVVL_Recovery_Connection_Repair.apk
          if gh release view revvl-recovery-connection-repair >/dev/null 2>&1; then
            gh release upload revvl-recovery-connection-repair REVVL_Recovery_Connection_Repair.apk --clobber
          else
            gh release create revvl-recovery-connection-repair REVVL_Recovery_Connection_Repair.apk --title "REVVL Recovery — Connection Repair" --notes "Native dashboard on 8788; explicit rig engine diagnostic distinguishes Android and old Character Lab services on 8770; Episode 2 and cast photo counts in diagnostics. Existing Chrome browser data remains on its origin. Back up the full project before making Android app installation changes. Android debug APK signatures can conflict with previous installs."
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REVVL-Tab2-Super-Tablet-debug
          path: revvl-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build REVVL Tab 2 launcher APK
on:
  push:
    branches: [revvl-tab2-android-launcher]
    paths:
      - "revvl-launcher/**"
      - ".github/workflows/revvl-build-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android launcher
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install SDK packages using preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --project-dir revvl-launcher --no-daemon :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REVVL-Tab2-Super-Tablet-debug
          path: revvl-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

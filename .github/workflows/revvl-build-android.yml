name: Build REVVL Tab 2 launcher APK
on:
  push:
    branches: [revvl-tab2-android-launcher]
    paths:
      - "revvl-launcher/**"
      - ".github/workflows/revvl-build-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android launcher
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install SDK packages using preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --project-dir revvl-launcher --no-daemon :app:assembleDebug
      - name: Allow Android emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 on-device emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r revvl-launcher/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.revvl.supertablet.recovery/com.revvl.supertablet.MainActivity
            adb forward tcp:18788 tcp:8788
            for i in $(seq 1 25); do if curl -fsS -D /tmp/revvl-headers.txt -o /tmp/revvl-home.html http://127.0.0.1:18788/REVVL_Super_Tablet_v2.html; then break; fi; sleep 2; done
            grep -q '200 OK' /tmp/revvl-headers.txt
            grep -q 'X-REVVL-Server: REVVL-RECOVERY/3.5' /tmp/revvl-headers.txt
            grep -q 'REVVL Recovery v3.5' /tmp/revvl-home.html
            echo "Recovery APK installed and served the correct dashboard on Android 15."
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REVVL-Tab2-Super-Tablet-debug
          path: revvl-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
